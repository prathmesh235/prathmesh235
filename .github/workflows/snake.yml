name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: prathmesh235
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Add PRATHMESH Text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dist/github-contribution-grid-snake.svg")

          if path.exists():
              svg = path.read_text()

              text = '''
              <text
                x="50%"
                y="50%"
                text-anchor="middle"
                dominant-baseline="middle"
                font-family="Arial, sans-serif"
                font-size="32"
                font-weight="bold"
                fill="#24292f">
                PRATHMESH
              </text>
              '''

              svg = svg.replace("</svg>", text + "</svg>")
              path.write_text(svg)
          PY

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
